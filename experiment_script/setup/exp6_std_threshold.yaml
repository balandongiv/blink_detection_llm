epoch_duration_s: 30.0
center_method: median
filter_low: 1.0
filter_high: 20.0
resample_rate: 100
autoreject_random_state: 42

# std_threshold values to sweep — this is the ablation that decided std=3.0.
std_thresholds: [2.5, 3.0, 3.5, 4.0]

# Channel-selection groups to sweep, per dataset — the best channels/regions from
# exp1 (frontal region + its per-hemisphere halves + the top single channels).
groups:
  raja:
    - single:E22
    - single:E9
    - single:E3
    - single:E23
    - frontal
    - frontal_left
    - frontal_right
  cao2018:
    - single:FP1
    - single:FP2
    - frontal
    - frontal_left
    - frontal_right
