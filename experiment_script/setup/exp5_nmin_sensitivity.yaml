epoch_duration_s: 30.0
std_threshold: 3.0
center_method: median
filter_low: 1.0
filter_high: 20.0
resample_rate: 100
autoreject_random_state: 42

# Stage-B fallback-count values to sweep (min_flagged_epochs).
nmin_values: [1, 2, 3, 5]

# Channel-selection groups to sweep, per dataset — the best channels/regions from
# exp1 (frontal region + its per-hemisphere halves + the top single channels).
groups:
  raja:
    - single:E22
    - single:E9
    - single:E3
    - single:E23
    - frontal
    - frontal_left
    - frontal_right
  cao2018:
    - single:FP1
    - single:FP2
    - frontal
    - frontal_left
    - frontal_right
