epoch_duration_s: 30.0
long_threshold_s: 0.5
filter_low: 1.0
filter_high: 20.0
resample_rate: 100

# Channel-selection groups to sweep, per dataset — the best channels/regions from
# exp1 (frontal region + its per-hemisphere halves + the top single channels).
# Detector conditions (BLINKER-concat/MNE-annot/Proposed-Mean/Proposed-Med) and
# their parameters come from experiment_script/setup/exp2_strategy_comparison.yaml
# — the single source of truth for detector configuration, same as exp7.
groups:
  raja:
    - single:E22
    - single:E9
    - single:E3
    - single:E23
    - frontal
    - frontal_left
    - frontal_right
  cao2018:
    - single:FP1
    - single:FP2
    - frontal
    - frontal_left
    - frontal_right
