  # Single-electrode selection groups for the remaining 26 full-montage channels
  # (the 6 above are the original frontal-only selections). Added so exp1's
  # single-channel rerun covers every electrode in `all_channel` below, not
  # only the frontal ones.
  # E129/Cz never resolves to an actual recorded channel in the Internal (raja) FIF
  # files (confirmed by a full exp1 rerun, 2026-09-07: this group produced 0 rows for
  # all 46 sessions, unlike every other newly-added *_only group here). This matches
  # `all_channel` below, which also lists 129 but likewise never resolves it — its
  # count still reaches 32 only because a different region's own listing (occipital's
  # 83) is pulled in by the union in build_selection_groups. Kept here (rather than
  # deleted) as a record that Cz was considered and could not be validly single-channel
  # tested; the true resolvable single-electrode montage for Internal is 31 channels.
